services:
  - type: web
    runtime: node
    name: ai-mystery-room
    rootDir: .
    buildCommand: cd client && npm ci && npm run build && cd ../server && npm ci
    startCommand: cd server && npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: AI_PROVIDER
        value: mock
      - key: SESSION_SECRET
        generateValue: true
      - key: CASE_ACCESS_TOKEN_TTL_DAYS
        value: "30"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "10"
